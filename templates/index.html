{% extends "layout.html" %}
{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
  {% for k, title in cases.items() %}
    <div class="bg-white rounded-2xl shadow-md p-6 hover:shadow-xl transition">
      <div class="flex items-start justify-between">
        <div>
          <h2 class="text-indigo-600 font-bold text-lg">Caso {{k}}</h2>
          <p class="mt-2 text-slate-600">{{ title }}</p>
        </div>
        <div>
          <div class="bg-indigo-50 text-indigo-700 px-3 py-2 rounded-md font-semibold">Ir</div>
        </div>
      </div>
      <div class="mt-4">
        <a href="{{ url_for('form_case', case_id=k) }}" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg">Abrir</a>
      </div>
    </div>
  {% endfor %}
</div>
{% endblock %}
